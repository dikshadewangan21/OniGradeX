name: onigrader
description: OniGrader - on-device onion quality grading for procurement officers, farmers and admins.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.4.3
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  image: ^4.2.0
  tflite_flutter: ^0.12.1
  crypto: ^3.0.3
  uuid: ^4.4.0
  geolocator: ^12.0.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  qr_flutter: ^4.1.0
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/model/
